name: Update Google Scholar Citations

on:
  schedule:
    # Mon/Wed/Fri 02:00 UTC, like upstream al-folio: fewer runs means fewer
    # chances to hit a day where Google Scholar blocks the runner.
    - cron: "0 2 * * 1,3,5"
  workflow_dispatch:

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # A PAT (repo secret "PAT") is required so that the commit pushed
        # at the end of this workflow triggers the Deploy site workflow --
        # pushes made with the default GITHUB_TOKEN never trigger other
        # workflows (GitHub's loop prevention).
        with:
          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          echo "🔧 Installing dependencies..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Save current citations.yml hash
        id: before
        run: |
          echo "📦 Checking existing citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_before=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_before=$sha_before" >> $GITHUB_OUTPUT
            echo "📝 SHA before: $sha_before"
          else
            echo "sha_before=none" >> $GITHUB_OUTPUT
            echo "📝 No existing citations.yml file found."
          fi

      - name: Run citation update script
        id: run_citation_update
        shell: bash
        run: |
          echo "🚀 Running citation update script (citations refresh + auto-add missing publications, with retries)..."
          start_time=$(date)
          status=1
          for attempt in 1 2 3 4 5; do
            echo "▶️ Attempt $attempt..."
            # -u: unbuffered stdout so progress survives a timeout kill;
            # `set +e` around the call lets us capture the exit code before
            # the step's errexit aborts the retry loop (timeout kills
            # scholarly whenever Google Scholar stops answering the runner).
            set +e
            timeout 300 python -u bin/update_scholar_citations.py
            status=$?
            set -e
            if [ $status -eq 0 ]; then
              break
            fi
            echo "⚠️ Attempt $attempt failed (exit code $status). Retrying in 60s..."
            sleep 60
          done
          end_time=$(date)
          if [ $status -eq 0 ]; then
            echo "✅ Citation update succeeded (started at $start_time, ended at $end_time)."
            echo "✅ Citation update succeeded." >> $GITHUB_STEP_SUMMARY
          elif [ $status -eq 124 ]; then
            # Google Scholar not answering is an expected condition, not an
            # error (same semantics as upstream al-folio): skip quietly, the
            # next scheduled run picks it up.
            echo "ℹ️ Google Scholar did not answer within the timeout (started at $start_time, ended at $end_time). Skipping this update; no data was changed."
            echo "ℹ️ Scholar unreachable this run; citations not refreshed." >> $GITHUB_STEP_SUMMARY
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Citation update script failed with exit code $status (a real error, not a Scholar timeout)."
            echo "❌ Citation update script failed with exit code $status." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Save new citations.yml hash
        id: after
        run: |
          echo "🔍 Checking updated citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_after=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_after=$sha_after" >> $GITHUB_OUTPUT
            echo "📝 SHA after: $sha_after"
          else
            echo "sha_after=none" >> $GITHUB_OUTPUT
            echo "📝 citations.yml was not created or is missing."
          fi

      - name: Report citations.yml change in summary
        run: |
          echo "📋 Comparing citation file hashes..."
          if [ "${{ steps.before.outputs.sha_before }}" != "${{ steps.after.outputs.sha_after }}" ]; then
            echo "✅ _data/citations.yml was updated."
            echo "✅ _data/citations.yml was updated." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ _data/citations.yml was not changed."
            echo "ℹ️ _data/citations.yml was not changed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check bibliography entries for missing abs/url or html links
        if: steps.run_citation_update.outputs.skip != 'true'
        run: |
          echo "🔗 Checking _bibliography/papers.bib for missing links..."
          echo "## Bibliography link check" >> $GITHUB_STEP_SUMMARY
          python bin/check_bib_links.py >> $GITHUB_STEP_SUMMARY 2>&1 || true
          cat $GITHUB_STEP_SUMMARY

      - name: Configure Git
        if: steps.run_citation_update.outputs.skip != 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          echo "🔧 Git configured."

      - name: Commit and push if changed
        if: steps.run_citation_update.outputs.skip != 'true'
        run: |
          git add _data/citations.yml _bibliography/papers.bib
          git diff --staged --quiet || (
            echo "📤 Committing and pushing changes..."
            git commit -m "Update Google Scholar citations and publications"
            git pull --rebase
            git push
          )
